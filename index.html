<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Title & SEO Metadata -->
    <title>Global Media Hub PRO · Universal Streaming & Entertainment</title>
    <meta name="description" content="Ultimate OLED universal media portal for 45,000+ live radio stations, IPTV channels, YouTube 4K, podcasts, audiobooks, and 1,700+ streaming sites." />
    <meta name="keywords" content="media hub, streaming, iptv, radio, youtube, podcast, oled, universal player, live tv, anime, audiobooks" />
    <meta name="author" content="Hidden-Rhythm" />

    <!-- Theme & Display Configuration -->
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MediaHub" />
    <meta name="application-name" content="MediaHub PRO" />

    <!-- Favicons & Touch Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- OpenGraph Social Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Global Media Hub PRO · Universal Streaming" />
    <meta property="og:description" content="Stream 45,000+ radio stations, live IPTV channels, YouTube 4K, podcasts, and 1,700+ platforms in pure OLED black." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Global Media Hub PRO" />
    <meta name="twitter:description" content="Universal media portal with zero ads, synchronized lyrics, audio boost, and pure OLED dark mode." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-black text-[#e8ebf5] selection:bg-purple-600 selection:text-white overflow-hidden antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
